# Build & publish the desktop app for Windows AND macOS, automatically (Tauri).
#
# Trigger: push a version tag like  v1.1.0
#   git tag v1.1.0 && git push origin v1.1.0
# The tag must match "version" in package.json (tauri.conf.json reads it from
# there) — installed apps compare THAT number to decide if an update is newer.
#
# What happens: a tiny first job makes sure the GitHub Release (v1.1.0) exists,
# then GitHub spins up a Windows runner and a macOS (Apple Silicon) runner. Each
# builds its own installer with tauri-action and uploads to the SAME release:
#   - Windows → the NSIS installer  …_x64-setup.exe  (+ its .sig)
#   - macOS   → the …_aarch64.dmg for first installs, plus the …app.tar.gz
#               update bundle (+ its .sig)
#   - both    → latest.json  — the file installed apps poll. tauri-action merges
#               each platform's entry (download URL + signature) into it.
# Installed apps on BOTH platforms download the signed bundle in the background
# and install it on restart.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — the private key from `npx tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password (empty if you set none)
# Every update bundle is signed with it; apps refuse anything whose signature
# doesn't match the public key baked into tauri.conf.json. See RELEASING.md §1.
#
# No personal GitHub token needed here — GitHub gives the workflow its own token
# (GITHUB_TOKEN) with permission to publish releases on THIS repo.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # lets the workflow create/update the GitHub Release

jobs:
  # Create the release ONCE up front, so the two build jobs don't race to create
  # two releases for the same tag. If you made the tag via "Draft a new release →
  # Publish" on github.com, the release already exists and is reused.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          echo "id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false     # if one OS fails, still finish the other
      matrix:
        include:
          - os: windows-latest
            args: ''
            rust_targets: ''
          - os: macos-latest                        # Apple Silicon runner
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Caches compiled Rust crates between releases — a cold build takes a while.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Root deps = the Tauri CLI. Renderer deps = the Next.js app that
      # `tauri build` compiles first (beforeBuildCommand in tauri.conf.json).
      # SQLite is compiled into the Rust binary (rusqlite "bundled"), so there is
      # no native-module rebuild step any more — but each platform still builds on
      # its own runner because the Rust binary is native code.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix renderer

      - name: Build, sign & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true   # upload/merge latest.json for the updater
          args: ${{ matrix.args }}
