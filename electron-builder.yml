appId: com.barangay.management
productName: Barangay Management System
directories:
  output: dist
files:
  - main/dist/**/*
  - renderer/out/**/*
  - package.json
extraResources:
  - resources/**/*
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
publish:
  provider: github
  owner: mmmsss211
  repo: barangay-management
  private: true
mac:
  target: dmg
  category: public.app-category.business
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
