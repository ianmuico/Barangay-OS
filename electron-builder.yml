appId: com.barangay.management
productName: Barangay Management System
directories:
  output: dist
files:
  - main/dist/**/*
  - renderer/out/**/*
  - package.json
extraResources:
  - resources/**/*
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
mac:
  target: dmg
  category: public.app-category.business
win:
  target: nsis
linux:
  target: AppImage
