[package]
name = "barangay-management"
version = "1.4.1"
description = "Barangay Management System - Offline-first desktop application"
authors = ["Percival Ian Muico"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri shell ──
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# ── Core ──
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
dirs = "6"
tempfile = "3"
url = "2"
percent-encoding = "2"
html-escape = "0.2"

# ── Database ──
rusqlite = { version = "0.37", features = ["bundled", "backup"] }

# ── Crypto ──
bcrypt = "0.17"
aes-gcm = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2"

# ── Files / formats ──
rust_xlsxwriter = "0.90"
calamine = "0.30"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"

# ── Network ──
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
local-ip-address = "0.6"

# ── PDF via system Edge / Chrome ──
headless_chrome = "1"

# ── System info (AI lag guard) ──
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
